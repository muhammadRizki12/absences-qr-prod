name: Deploy absences-qr

on:
  push:
    branches:
      - main # Workflow berjalan setiap kali push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/absences-qr-prod

            # 1. Pastikan container lama mati dan bersih sebelum build baru
            docker compose down --remove-orphans

            # 2. Build dan jalankan
            docker compose up -d --build

            # 3. Tunggu beberapa detik agar database siap sebelum migrasi
            sleep 10

            # 4. Jalankan perintah Laravel
            docker compose exec -T app composer install --no-dev --optimize-autoloader
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
